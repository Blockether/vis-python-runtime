name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  native:
    name: build + test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64,    os: ubuntu-24.04,     jdk-arch: x64,     lib: libvispython.so }
          - { platform: linux-arm64,  os: ubuntu-24.04-arm, jdk-arch: aarch64, lib: libvispython.so }
          - { platform: darwin-arm64, os: macos-14,         jdk-arch: aarch64, lib: libvispython.dylib }
          - { platform: darwin-x64,   os: macos-13,         jdk-arch: x64,     lib: libvispython.dylib }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils linux-libc-dev meson ninja-build pkg-config
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.jdk-arch }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Build the complete platform runtime
        run: native/vispython/build.sh
      - name: Compile the Java bridge
        run: clojure -T:build javac
      - name: Run the suite against the built runtime
        run: clojure -M:test
      - name: Build and inspect the platform archive
        run: |
          clojure -T:build platform-archive :platform '${{ matrix.platform }}'
          scripts/verify-platform-archive.sh '${{ matrix.platform }}'
