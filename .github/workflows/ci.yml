name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  linux:
    name: build + test ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build and execute the cdylibs and native worker on the oldest supported glibc.
          - { platform: linux-x64, os: ubuntu-22.04 }
          - { platform: linux-arm64, os: ubuntu-22.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils linux-libc-dev meson ninja-build pkg-config zlib1g-dev
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # GraalVM CE is the JDK here: it runs the suite AND compiles the worker image.
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Build, test and inspect the complete runtime
        run: |
          native/vispython/build.sh
          clojure -T:build javac
          clojure -T:build worker-image
          clojure -M:test
          clojure -T:build platform-archive :platform '${{ matrix.platform }}'
          scripts/verify-platform-archive.sh '${{ matrix.platform }}'
          VIS_PYTHON_NATIVE_PATH="$PWD/target/archive-check-${{ matrix.platform }}" \
            clojure -M:test -n com.blockether.vis-python-runtime.worker-test

  darwin:
    name: build + test ${{ matrix.platform }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          # No GraalVM CE for darwin-x64: that archive ships without a worker image
          # (build.clj `worker-platforms`) and is built on a stock JDK under Rosetta.
          - { platform: darwin-arm64, worker: true, jdk-arch: aarch64, prefix: "" }
          - { platform: darwin-x64, worker: false, jdk-arch: x64, prefix: "/usr/bin/arch -x86_64" }
    steps:
      - uses: actions/checkout@v6
      - name: Verify Rosetta for the x64 build
        if: matrix.platform == 'darwin-x64'
        run: /usr/bin/arch -x86_64 /usr/bin/uname -m | grep -qx x86_64
      - uses: ./.github/actions/setup-graalvm-25
        if: matrix.worker
      - uses: actions/setup-java@v5
        if: ${{ !matrix.worker }}
        with:
          distribution: temurin
          java-version: "25"
          architecture: ${{ matrix.jdk-arch }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Build, test and inspect the complete runtime
        run: |
          ${{ matrix.prefix }} native/vispython/build.sh
          ${{ matrix.prefix }} clojure -T:build javac
          if [ '${{ matrix.worker }}' = 'true' ]; then clojure -T:build worker-image; fi
          ${{ matrix.prefix }} clojure -M:test
          ${{ matrix.prefix }} clojure -T:build platform-archive :platform '${{ matrix.platform }}'
          ${{ matrix.prefix }} scripts/verify-platform-archive.sh '${{ matrix.platform }}'

  windows:
    name: build + test windows-x64
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/setup-graalvm-25
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - name: Build and execute the Windows runtime and extracted archive
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./native/vispython/build.ps1
          clojure -T:build javac
          clojure -T:build worker-image
          clojure -T:build windows-jail-probe
          ./scripts/test-windows.ps1
          clojure -T:build platform-archive :platform windows-x64
          ./scripts/verify-platform-archive.ps1
          $env:VIS_PYTHON_NATIVE_PATH = (Resolve-Path 'target/archive-check-windows-x64').Path
          ./scripts/test-windows.ps1

  docs:
    name: generate and check API documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      - run: clojure -T:build javac
      - run: clojure -X:docs
      - run: clojure -M:docs:test -d doc -n runtime-docs-test
      - uses: actions/upload-artifact@v6
        with:
          name: api-documentation
          path: |
            target/vis-python-runtime-api-docs-*.zip
            target/vis-python-runtime-*-javadoc.jar
          if-no-files-found: error
