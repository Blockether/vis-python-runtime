# ruff configuration for the Python this library carries.
#
# Two populations with different contracts:
#
# `python/vis_runtime/` is THIS package's own code — the loader the host calls
# into — and is held to the full rule set.
#
# `resources/vis-python/` and `resources/vis-shims/` are the sandbox sources,
# byte-identical to Vis' copies while both exist (`sandbox-parity-test`), so
# their configuration is Vis' configuration: they are executed INTO a session,
# reach for host-injected `__vis_*__` globals ruff cannot see (F821), and keep
# their GraalPy-3.11 shape until Vis pins this library. A modernization rule
# rewriting proven sandbox internals would only break parity; real breakage
# (E9/F6/F7/F82) still fails here.

target-version = "py311"
line-length = 88
indent-width = 4

extend-exclude = [".venv", "__pycache__", "build", "dist", "target", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C4"]
ignore = [
  # Shims mirror third-party APIs, so signatures keep their upstream shape.
  "B008",
]

[lint.per-file-ignores]
"**/vis-shims/*.py" = [
  "F401", "F811", "F821", "E402", "E741", "B904", "B905", "UP004",
  "E401", "E731", "I001", "B007", "B023", "F841", "UP", "C4",
]
"**/vis-python/*.py" = [
  "F821", "E401", "E402", "E701", "E702", "E731", "I001", "B007", "B023",
  "B904", "B905", "F841", "UP", "C4",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
