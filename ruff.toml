# ruff configuration for the Python this library carries.
#
# Two populations with different contracts:
#
# `python/vis_runtime/` is THIS package's own code — the loader the host calls
# into — and is held to the full rule set.
#
# `resources/vis-python/` is the sandbox runtime. It is EXECUTED INTO a session
# rather than imported, and it reaches for `__vis_*__` names the host injects,
# which ruff cannot see (F821). Real breakage (E9/F6/F7/F82) still fails here.

target-version = "py311"
line-length = 88
indent-width = 4

extend-exclude = [".venv", "__pycache__", "build", "dist", "target", "node_modules"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "C4"]
ignore = [
  # Shims mirror third-party APIs, so signatures keep their upstream shape.
  "B008",
]

[lint.per-file-ignores]
"**/vis-python/*.py" = [
  "F821", "E401", "E402", "E701", "E702", "E731", "I001", "B007", "B023",
  "B904", "B905", "F841", "UP", "C4",
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
